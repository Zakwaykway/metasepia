  #    operation: subtract
  #    fillet: 1.75

pcbs:
  metasepia_v2:
    template: kicad8
    outlines:
      main:
        outline: main
    footprints:
      switches:
        what: hs-mx
        where:
          - /matrix_.*/
          - /thumb_.*/
        params:
          left: "{{row_net}}"
          right: "{{colrow}}"
      diodes:
        what: ceoloide/diode_tht_sod123
        where:
          - /matrix_.*/
          - /thumb_.*/
        params:
          from: "{{colrow}}"
          to: "{{column_net}}"

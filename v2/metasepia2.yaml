  #    operation: subtract
  #    fillet: 1.75

pcbs:
  metasepia_v2:
    template: kicad8
    outlines:
      main:
        outline: main
    footprints:
      switches:
        what: hs-mx-choc
        where: switches
        params:
          left: "{{row_net}}"
          right: "{{colrow}}"
      encoder: 
        what: ceoloide/rotary_encoder_ec11_ec12
        where: [encoder]
        adjust.rotate: 180
        params:
          include_plated_mounting_holes: false
          #encoder_pads_position: 8.254
          S1: "{{col_net}}"
          S2: "{{row_net}}"
          A: enc1
          C: enc2
      diodes:
        what: ceoloide/diode_tht_sod123
        where: [switches, encoder]
        adjust.shift: [8, 0]
        adjust.rotate: -90
        params:
          from: "{{colrow}}"
          to: "{{column_net}}"
#        adjust:
#          shift: [0, -4.5]
